# WSID_FE: new-main에 push → 빌드 확인 → FE_ENV 시크릿을 Parameter Store에 저장 → FE 서버의 web(Nginx + FE) 다시 빌드
# 필요한 GitHub Secret (레포 Settings > Secrets and variables > Actions > Repository secret): FE_ENV = deploy/fe/.env 전체 내용
name: Deploy FE

on:
  push:
    branches: [new-main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::609546557988:role/wsid-github-deploy
  FE_INSTANCE: i-FE_INSTANCE_ID     # wsid-fe (Nginx + FE). 인스턴스를 만든 뒤 실제 ID로 바꿔요
  BE_INSTANCE: i-0c765a9b9741a54fd   # wsid-be (Spring + Redis)
  AI_INSTANCE: i-0ae5dcac7c5d45bcd   # wsid-ai
  KIT_BRANCH: new-main               # 배포 키트(deploy/)가 있는 WSID_FE 브랜치

permissions:
  id-token: write   # AWS OIDC 로그인
  contents: read

concurrency:
  group: deploy-fe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드 확인
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: AWS 로그인 (OIDC, 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: FE_ENV → Parameter Store (/wsid/fe/env)
        env:
          ENV_CONTENT: ${{ secrets.FE_ENV }}
        run: |
          test -n "$ENV_CONTENT" || { echo "::error::FE_ENV 시크릿이 비어 있어요"; exit 1; }
          aws ssm put-parameter --name /wsid/fe/env --type SecureString --tier Intelligent-Tiering \
            --overwrite --value "$ENV_CONTENT" > /dev/null
          echo "저장 완료 (값은 출력하지 않아요)"
      - name: 서버에 배포 명령 (SSM)
        env:
          INSTANCE: ${{ env.FE_INSTANCE }}
          BRANCH: ${{ github.ref_name }}
        run: |
          CMD="cd /opt/wsid/WSID_FE && git fetch -q origin $KIT_BRANCH && git reset -q --hard FETCH_HEAD && bash deploy/scripts/deploy.sh fe $BRANCH"
          ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
                --comment "wsid deploy fe $BRANCH ${GITHUB_SHA::7}" \
                --parameters "$(jq -n --arg c "$CMD" '{commands:[$c], executionTimeout:["3600"]}')" \
                --query Command.CommandId --output text)
          echo "SSM command: $ID"
          for i in $(seq 1 240); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "상태: $STATUS"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text | tail -60
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text | tail -40
          test "$STATUS" = Success
